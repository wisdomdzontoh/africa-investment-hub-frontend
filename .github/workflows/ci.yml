# Frontend CI (INFRA-02): typecheck, lint, i18n parity, build — on every PR
# and push to main. Unit tests run in the main job; the `smoke` job probes
# the production build over HTTP (no browser).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint app components features lib types

      - name: i18n parity (en/fr/zh)
        run: |
          node -e "
            const flat = (o, p = '') => Object.entries(o).flatMap(([k, v]) =>
              typeof v === 'object' && v !== null ? flat(v, p + k + '.') : [p + k]);
            const en = new Set(flat(require('./messages/en.json')));
            let failed = false;
            for (const loc of ['fr', 'zh']) {
              const keys = new Set(flat(require('./messages/' + loc + '.json')));
              const missing = [...en].filter(k => !keys.has(k));
              const extra = [...keys].filter(k => !en.has(k));
              if (missing.length || extra.length) {
                failed = true;
                console.error(loc, 'missing:', missing, 'extra:', extra);
              }
            }
            if (failed) process.exit(1);
            console.log('i18n parity OK (' + en.size + ' keys)');
          "

      - name: Unit + component tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time publishable values only — never secrets.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Syntactically valid dummy (base64 "clerk.example.com$") so the
          # build passes without a real instance; set the repo variable to
          # override.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}

  # HTTP smoke test of the production build — no browser. Boots the standalone
  # server exactly as production would and asserts the critical public routes
  # respond. This is the gate that catches runtime-config regressions (e.g. a
  # crashing middleware) that typecheck/build/unit tests cannot see. Deeper
  # browser e2e (signup → onboarding → submit) re-introduces Playwright when
  # those flows get test fixtures.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}

      # `output: standalone` puts the server in .next/standalone but leaves
      # static assets and /public outside it — copy them in so the standalone
      # server serves the full app.
      - name: Prepare standalone server assets
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Boot standalone server and probe critical routes
        env:
          # Placeholder — NOT a real key. clerkMiddleware requires the secret
          # to exist at request time; these probes only hit public,
          # cookie-less routes, so Clerk's API is never actually called.
          CLERK_SECRET_KEY: sk_test_e2e_placeholder_000000000000000000
          PORT: "3000"
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -s --noproxy '*' -o /dev/null http://127.0.0.1:3000/en && break
            sleep 1
          done

          fail=0
          check() {
            code=$(curl -s --noproxy '*' -o /tmp/body -w '%{http_code}' "http://127.0.0.1:3000$1")
            if [ "$code" = "$2" ]; then
              echo "OK   $1 -> $code"
            else
              echo "FAIL $1 -> $code (expected $2)"
              fail=1
            fi
          }

          check /en 200
          grep -q "<h1" /tmp/body || { echo "FAIL /en is missing its <h1>"; fail=1; }
          check /en/opportunities 200
          check /en/this-route-does-not-exist 404
          exit $fail
