# Frontend CI (INFRA-02): typecheck, lint, i18n parity, build — on every PR
# and push to main. Unit/e2e steps join once FE-15 lands the test stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint app components features lib types

      - name: i18n parity (en/fr/zh)
        run: |
          node -e "
            const flat = (o, p = '') => Object.entries(o).flatMap(([k, v]) =>
              typeof v === 'object' && v !== null ? flat(v, p + k + '.') : [p + k]);
            const en = new Set(flat(require('./messages/en.json')));
            let failed = false;
            for (const loc of ['fr', 'zh']) {
              const keys = new Set(flat(require('./messages/' + loc + '.json')));
              const missing = [...en].filter(k => !keys.has(k));
              const extra = [...keys].filter(k => !en.has(k));
              if (missing.length || extra.length) {
                failed = true;
                console.error(loc, 'missing:', missing, 'extra:', extra);
              }
            }
            if (failed) process.exit(1);
            console.log('i18n parity OK (' + en.size + ' keys)');
          "

      - name: Build
        run: pnpm build
        env:
          # Build-time publishable values only — never secrets.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Syntactically valid dummy (base64 "clerk.example.com$") so the
          # build passes without a real instance; set the repo variable to
          # override.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
